name: Notify Feishu Card On Merge Master

on:
  pull_request_target:
    types: [closed]
    branches:
      - main

permissions:
  contents: read

jobs:
  notify:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest

    steps:
      - name: Build Feishu signed payload
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_TIME: ${{ github.event.pull_request.closed_at }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import time
          import hmac
          import base64
          import hashlib

          timestamp = str(int(time.time()))
          secret = os.environ["FEISHU_SECRET"]

          # 飞书签名：timestamp + "\n" + secret，HMAC-SHA256 后再 Base64
          string_to_sign = f"{timestamp}\n{secret}".encode("utf-8")
          sign = base64.b64encode(
              hmac.new(string_to_sign, digestmod=hashlib.sha256).digest()
          ).decode("utf-8")

          repo = os.environ["REPO"]
          pr_number = os.environ["PR_NUMBER"]
          pr_title = os.environ["PR_TITLE"]
          pr_url = os.environ["PR_URL"]
          pr_author = os.environ["PR_AUTHOR"]
          merged_by = os.environ["MERGED_BY"]
          base_ref = os.environ["BASE_REF"]
          head_ref = os.environ["HEAD_REF"]
          merge_time = os.environ["MERGE_TIME"]

          payload = {
              "timestamp": timestamp,
              "sign": sign,
              "msg_type": "interactive",
              "card": {
                  "config": {
                      "wide_screen_mode": True,
                      "enable_forward": True
                  },
                  "header": {
                      "template": "green",
                      "title": {
                          "tag": "plain_text",
                          "content": "GitHub 合并通知"
                      }
                  },
                  "elements": [
                      {
                          "tag": "div",
                          "text": {
                              "tag": "lark_md",
                              "content": f"**仓库**：{repo}\n**PR**：#{pr_number} {pr_title}"
                          }
                      },
                      {
                          "tag": "div",
                          "fields": [
                              {
                                  "is_short": True,
                                  "text": {
                                      "tag": "lark_md",
                                      "content": f"**目标分支**\n{base_ref}"
                                  }
                              },
                              {
                                  "is_short": True,
                                  "text": {
                                      "tag": "lark_md",
                                      "content": f"**来源分支**\n{head_ref}"
                                  }
                              },
                              {
                                  "is_short": True,
                                  "text": {
                                      "tag": "lark_md",
                                      "content": f"**发起人**\n{pr_author}"
                                  }
                              },
                              {
                                  "is_short": True,
                                  "text": {
                                      "tag": "lark_md",
                                      "content": f"**合并人**\n{merged_by}"
                                  }
                              }
                          ]
                      },
                      {
                          "tag": "div",
                          "text": {
                              "tag": "lark_md",
                              "content": f"**合并时间**：{merge_time}"
                          }
                      },
                      {
                          "tag": "action",
                          "actions": [
                              {
                                  "tag": "button",
                                  "text": {
                                      "tag": "plain_text",
                                      "content": "查看 PR"
                                  },
                                  "type": "primary",
                                  "url": pr_url
                              }
                          ]
                      }
                  ]
              }
          }

          with open("payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          PY

      - name: Send message to Feishu
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          curl -fsS -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d @payload.json