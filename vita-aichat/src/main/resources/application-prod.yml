# 项目相关配置
vita:
  # 项目名称
  name: vita
  # 项目版本
  version: 1.0
  # 项目版权年份
  copyrightYear: 2026
  # 获取地址开关
  addressEnabled: true
  # 服务端口
  http-port: 19003
  # mysql 配置
  mysql:
    master:
      host: 106.54.205.33
      port: 3306
      database: be_vita
      username: root
      password: WQO6D9ax#f*QPJup
  # redis 配置
  redis:
    # 自动装配
    enabled: true
    # 是否启用 Redis
    open: true
    host: 106.54.205.33
    port: 6379
    passwd: dhQjF6HJfn@&bF6!
  # sa-token 配置
  sa-token:
    # token 名称（同时也是 cookie 名称）
    token-name: Authorization
    # token 有效期（单位：秒） 默认30天，-1 代表永久有效
    timeout: 3600
    # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
    active-timeout: 3600
    # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
    is-concurrent: true
    # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
    is-share: false
    # 是否输出操作日志
    is-log: true
    # 指定 token 提交时的前缀
    token-prefix: Bearer
    # jwt秘钥
    jwt-secret-key: wiki-kangLe-Cloud
  ai:
    modules:
      aichat:
        enabled: true
#        default-provider: kimi
#        default-model: kimi-k2.5
        default-provider: qwen
        default-model: qwen-plus
        allowed-providers:
          - qwen
          - kimi
  aichat:
    default-system-prompt: 你是一个严谨的开发助手。
    stream-enabled: true
