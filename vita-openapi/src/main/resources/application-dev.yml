# 项目相关配置
vita:
  name: vita
  version: 1.0
  copyrightYear: 2026
  addressEnabled: true
  http-port: 19002
  mysql:
    master:
      host: localhost
      port: 3306
      database: be_vita
      username: root
      password: password
  redis:
    enabled: true
    open: true
    host: localhost
    port: 6379
    passwd: password
  sa-token:
    token-name: Authorization
    timeout: 3600
    active-timeout: 3600
    is-concurrent: true
    is-share: false
    is-log: true
    token-prefix: Bearer
    jwt-secret-key: secret-key
  hot:
    enabled-sources:
      - weibo
      - zhihu
      - baidu
      - bilibili
      - juejin
      - ithome
      - 36kr
      - sspai
    refresh-cron: 0 0/10 * * * ?
    stale-threshold-minutes: 30
    python:
      base-url: http://127.0.0.1:8000
      api-key: 4gqTA4cx5X*#I6QG
      timeout-ms: 8000
