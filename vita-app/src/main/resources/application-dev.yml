vita:
  http-port: 19004
  mysql:
    master:
      host: localhost
      port: 3306
      database: be_vita
      username: root
      password: password
  redis:
    enabled: true
    open: true
    host: localhost
    port: 6379
    passwd: password
  sa-token:
    token-name: Authorization
    timeout: 2592000
    active-timeout: 604800
    is-concurrent: true
    is-share: false
    is-log: true
    token-prefix: Bearer
    jwt-secret-key: dev-app-jwt-secret-change-before-deploy
  app:
    oauth:
      frontend-redirect-uri: http://localhost:5173/oauth/callback
      state-timeout: 5m
      ticket-timeout: 60s
      github:
        enabled: false
        client-id: ${VITA_GITHUB_CLIENT_ID:}
        client-secret: ${VITA_GITHUB_CLIENT_SECRET:}
        callback-uri: http://localhost:19004/app/api/auth/oauth/github/callback
