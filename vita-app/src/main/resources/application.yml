vita:
  auth:
    login-type: app
    extra-exclude-paths:
      - /auth/register
      - /auth/login
      - /auth/oauth/*/authorize
      - /auth/oauth/*/callback
      - /auth/oauth/ticket/exchange
      - /captcha/**
      - /error

server:
  port: ${vita.http-port}
  servlet:
    context-path: /app/api

spring:
  profiles:
    active: prod
  application:
    name: vita-app
  config:
    import:
      - optional:classpath:application-captcha.yml
  datasource:
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          type: com.zaxxer.hikari.HikariDataSource
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${vita.mysql.master.host}:${vita.mysql.master.port}/${vita.mysql.master.database}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
          username: ${vita.mysql.master.username}
          password: ${vita.mysql.master.password}
  data:
    redis:
      enabled: ${vita.redis.enabled}
      open: ${vita.redis.open}
      host: ${vita.redis.host}
      port: ${vita.redis.port}
      database: 3
      password: ${vita.redis.passwd}
      timeout: 10s
      lettuce:
        pool:
          min-idle: 2
          max-idle: 8
          max-active: 30
          max-wait: 6000ms
          time-between-eviction-runs: 60s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  login: false

sa-token:
  token-name: ${vita.sa-token.token-name}
  timeout: ${vita.sa-token.timeout}
  active-timeout: ${vita.sa-token.active-timeout}
  is-concurrent: ${vita.sa-token.is-concurrent}
  is-share: ${vita.sa-token.is-share}
  is-log: ${vita.sa-token.is-log}
  token-prefix: ${vita.sa-token.token-prefix}
  jwt-secret-key: ${vita.sa-token.jwt-secret-key}

logging:
  level:
    root: info
    com.vita: debug
