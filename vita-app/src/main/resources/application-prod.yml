vita:
  http-port: ${VITA_APP_HTTP_PORT:19004}
  mysql:
    master:
      host: ${VITA_MYSQL_HOST}
      port: ${VITA_MYSQL_PORT:3306}
      database: ${VITA_MYSQL_DATABASE}
      username: ${VITA_MYSQL_USERNAME}
      password: ${VITA_MYSQL_PASSWORD}
  redis:
    enabled: true
    open: true
    host: ${VITA_REDIS_HOST}
    port: ${VITA_REDIS_PORT:6379}
    passwd: ${VITA_REDIS_PASSWORD}
  sa-token:
    token-name: Authorization
    timeout: ${VITA_APP_TOKEN_TIMEOUT:2592000}
    active-timeout: ${VITA_APP_TOKEN_ACTIVE_TIMEOUT:604800}
    is-concurrent: true
    is-share: false
    is-log: false
    token-prefix: Bearer
    jwt-secret-key: ${VITA_APP_JWT_SECRET}
  app:
    oauth:
      frontend-redirect-uri: ${VITA_APP_OAUTH_FRONTEND_REDIRECT_URI}
      state-timeout: 5m
      ticket-timeout: 60s
      github:
        enabled: ${VITA_GITHUB_OAUTH_ENABLED:false}
        client-id: ${VITA_GITHUB_CLIENT_ID:}
        client-secret: ${VITA_GITHUB_CLIENT_SECRET:}
        callback-uri: ${VITA_GITHUB_CALLBACK_URI:}
