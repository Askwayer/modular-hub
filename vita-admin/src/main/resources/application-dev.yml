server:
  port: 19001
  servlet:
    context-path: /admin/api

# 服务配置
spring:

  data:
    # redis 配置
    redis:
      # 是否自动装配
      enabled: false
      # 是否启用 Redis
      open: true
      # 地址
      host: 106.54.205.33
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 10
      # 密码
      password: dhQjF6HJfn@&bF6!
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池最大连接数
          max-active: 200
          # 连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms
          # 连接池中的最大空闲连接
          max-idle: 10
          # 连接池中的最小空闲连接
          min-idle: 0