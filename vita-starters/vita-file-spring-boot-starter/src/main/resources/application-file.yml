vita:
  file:
    enabled: true
    active: local
    public-prefix: public
    private-prefix: private
    max-file-size: 10485760
    sign-expire-seconds: 300
    local:
      base-path: /data/vita/uploads
      public-domain: https://oss.kangle.cloud/public
      private-domain: https://oss.kangle.cloud/private
    signature:
      secret: ${FILE_SIGNATURE_SECRET:change-me-local-signature-secret}

