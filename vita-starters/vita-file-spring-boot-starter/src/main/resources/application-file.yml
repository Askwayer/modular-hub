vita:
  file:
    enabled: true
    active: local
    public-prefix: public
    private-prefix: private
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - gif
      - pdf
      - doc
      - docx
      - xls
      - xlsx
      - csv
      - txt
      - zip
      - mp4
    max-file-size: 10485760
    sign-expire-seconds: 300
    local:
      base-path: /data/vita/uploads
    signature:
      secret: ${FILE_SIGNATURE_SECRET:change-me-local-signature-secret}

