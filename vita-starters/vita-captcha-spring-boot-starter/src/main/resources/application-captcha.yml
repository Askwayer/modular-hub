vita:
  captcha:
    enabled: true
    captcha-type: slide
    store: auto
    key-prefix: "auth:captcha:"
    ttl: 3m
    max-failures: 5

    slide:
      width: 320
      height: 80
      tolerance: 6
      min-track-points: 3
      handle-width: 44
      track-color: 224,229,238
      goal-color: 94,129,255

    # 切换图形文本验证码示例
    # captcha-type: char
    # char:
